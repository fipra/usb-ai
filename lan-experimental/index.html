<!doctype html><html lang="it"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>LlamaNest LAN sperimentale</title>
<style>body{font:16px system-ui;background:#f4f6f5;color:#14231a;max-width:900px;margin:20px auto;padding:0 16px}header{display:flex;gap:10px;align-items:center;flex-wrap:wrap}h1{font-size:1.5rem}button,select,textarea{font:inherit;padding:9px;border:1px solid #aab7ad;border-radius:8px}button{cursor:pointer;background:#146b40;color:white}select{max-width:100%}#history{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}#thread{background:white;border-radius:12px;min-height:40vh;padding:16px;white-space:pre-wrap;overflow-wrap:anywhere}article{margin:12px 0;padding:10px;border-bottom:1px solid #e1e7e3}textarea{box-sizing:border-box;width:100%;margin:12px 0}#status{color:#8a3434}small{color:#52645a}</style>
<header><h1>LlamaNest LAN · sperimentale</h1><select id="model" aria-label="Modello"></select><button id="refresh">Aggiorna modelli</button></header>
<small>Le chat e i file di testo sono salvati in questo browser. Il server elabora i messaggi e gli estratti dei documenti.</small>
<div id="history"></div><button id="new">Nuova chat</button> <button id="delete">Elimina chat</button>
<div id="thread"></div><p id="status" role="status"></p><label>Allega file di testo (.txt o .md): <input id="file" type="file" accept=".txt,.md"></label><p id="attachment"></p><form id="form"><textarea id="prompt" rows="3" placeholder="Scrivi un messaggio…" required></textarea><button id="send">Invia</button></form>
<script>
const strings={en:{title:'LlamaNest LAN · experimental',model:'Model',refresh:'Refresh models',privacy:'Chats and text files are stored in this browser. The server processes messages and document excerpts.',new:'New chat',delete:'Delete chat',attach:'Attach a text file (.txt or .md):',prompt:'Write a message…',send:'Send',you:'You',attachment:'Attachment: ',none:'No model found in the server folder.',unavailable:'Model server unavailable: ',confirm:'Delete this chat?',large:'Text file exceeds 200 KB.',generating:'Generating…',interrupted:'Response interrupted',document:'Attached document: '},it:{title:'LlamaNest LAN · sperimentale',model:'Modello',refresh:'Aggiorna modelli',privacy:'Le chat e i file di testo sono salvati in questo browser. Il server elabora i messaggi e gli estratti dei documenti.',new:'Nuova chat',delete:'Elimina chat',attach:'Allega file di testo (.txt o .md):',prompt:'Scrivi un messaggio…',send:'Invia',you:'Tu',attachment:'Allegato: ',none:'Nessun modello trovato nella cartella del server.',unavailable:'Server del modello non disponibile: ',confirm:'Eliminare questa chat?',large:'Il file di testo supera 200 KB.',generating:'Generazione in corso…',interrupted:'Risposta interrotta',document:'Documento allegato: '},fr:{title:'LlamaNest LAN · expérimental',model:'Modèle',refresh:'Actualiser les modèles',privacy:'Les discussions et fichiers texte sont enregistrés dans ce navigateur. Le serveur traite les messages et extraits.',new:'Nouvelle discussion',delete:'Supprimer',attach:'Joindre un fichier texte (.txt ou .md) :',prompt:'Écrivez un message…',send:'Envoyer',you:'Vous',attachment:'Pièce jointe : ',none:'Aucun modèle trouvé sur le serveur.',unavailable:'Serveur indisponible : ',confirm:'Supprimer cette discussion ?',large:'Le fichier dépasse 200 Ko.',generating:'Génération en cours…',interrupted:'Réponse interrompue',document:'Document joint : '},de:{title:'LlamaNest LAN · experimentell',model:'Modell',refresh:'Modelle aktualisieren',privacy:'Chats und Textdateien werden in diesem Browser gespeichert. Der Server verarbeitet Nachrichten und Dokumentauszüge.',new:'Neuer Chat',delete:'Chat löschen',attach:'Textdatei anhängen (.txt oder .md):',prompt:'Nachricht schreiben…',send:'Senden',you:'Du',attachment:'Anhang: ',none:'Kein Modell auf dem Server gefunden.',unavailable:'Modellserver nicht verfügbar: ',confirm:'Diesen Chat löschen?',large:'Textdatei ist größer als 200 KB.',generating:'Antwort wird erstellt…',interrupted:'Antwort unterbrochen',document:'Angehängtes Dokument: '},es:{title:'LlamaNest LAN · experimental',model:'Modelo',refresh:'Actualizar modelos',privacy:'Los chats y archivos de texto se guardan en este navegador. El servidor procesa mensajes y extractos.',new:'Nuevo chat',delete:'Eliminar chat',attach:'Adjuntar archivo de texto (.txt o .md):',prompt:'Escribe un mensaje…',send:'Enviar',you:'Tú',attachment:'Adjunto: ',none:'No se encontró ningún modelo en el servidor.',unavailable:'Servidor de modelo no disponible: ',confirm:'¿Eliminar este chat?',large:'El archivo supera 200 KB.',generating:'Generando respuesta…',interrupted:'Respuesta interrumpida',document:'Documento adjunto: '}};const lang=(navigator.language||'en').slice(0,2),t=strings[lang]||strings.en;document.documentElement.lang=strings[lang]?lang:'en';document.querySelector('h1').textContent=t.title;document.querySelector('small').textContent=t.privacy;document.getElementById('model').setAttribute('aria-label',t.model);document.getElementById('refresh').textContent=t.refresh;document.getElementById('new').textContent=t.new;document.getElementById('delete').textContent=t.delete;document.querySelector('label').firstChild.textContent=t.attach+' ';document.getElementById('prompt').placeholder=t.prompt;document.getElementById('send').textContent=t.send;
const $=id=>document.getElementById(id), key='llamanest-lan-experimental-v1'; let chats=[],active='',busy=false;
try{const data=JSON.parse(localStorage.getItem(key)||'{}');chats=Array.isArray(data.chats)?data.chats:[];active=data.active||''}catch{}
function save(){localStorage.setItem(key,JSON.stringify({chats,active}))}function id(){const b=new Uint8Array(16);crypto.getRandomValues(b);return Array.from(b,x=>x.toString(16).padStart(2,'0')).join('')}
function current(){return chats.find(c=>c.id===active)}function create(){let c={id:id(),title:t.new,messages:[],document:null};chats.unshift(c);active=c.id;save();render();return c}
function render(){let c=current();$('history').replaceChildren();for(const item of chats){let b=document.createElement('button');b.textContent=item.title;b.onclick=()=>{if(busy)return;active=item.id;save();render()};$('history').append(b)}$('thread').replaceChildren();for(const m of c?.messages||[]){const a=document.createElement('article'),strong=document.createElement('strong'),text=document.createElement('div');strong.textContent=m.role==='user'?t.you:'LlamaNest';text.textContent=m.content;a.append(strong,text);$('thread').append(a)}$('attachment').textContent=c?.document?t.attachment+c.document.name:'';$('delete').disabled=busy||!c;$('new').disabled=busy;$('send').disabled=busy}
async function models(){try{const r=await fetch('/api/models',{headers:{'X-LlamaNest':'1'}});const v=await r.json();if(!r.ok)throw Error(v.error);$('model').replaceChildren();for(const m of v.models){let o=document.createElement('option');o.value=m.id;o.textContent=m.id;$('model').append(o)}$('status').textContent=v.models.length?'':t.none}catch(e){$('status').textContent=t.unavailable+e.message}}
$('refresh').onclick=models;$('new').onclick=create;$('delete').onclick=()=>{if(!current()||!confirm(t.confirm))return;chats=chats.filter(c=>c.id!==active);active=chats[0]?.id||'';save();render()};
$('file').onchange=async e=>{let f=e.target.files[0];e.target.value='';if(!f)return;if(f.size>200000){$('status').textContent=t.large;return}let c=current()||create();c.document={name:f.name,text:await f.text()};save();render()};
$('form').onsubmit=async e=>{e.preventDefault();if(busy)return;const text=$('prompt').value.trim(),model=$('model').value;if(!text||!model)return;const c=current()||create();c.messages.push({role:'user',content:text});if(c.messages.length===1)c.title=text.slice(0,45);$('prompt').value='';save();busy=true;render();$('status').textContent=t.generating;let answer={role:'assistant',content:''};c.messages.push(answer);render();try{const messages=c.messages.slice(0,-1).slice(-32);if(c.document)messages.unshift({role:'system',content:t.document+c.document.name+'\n'+c.document.text.slice(0,60000)});const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model,messages})});if(!r.ok){const v=await r.json();throw Error(v.error)}const reader=r.body.getReader(),decoder=new TextDecoder();let pending='',finished=false;for(;;){const {value,done}=await reader.read();pending+=decoder.decode(value||new Uint8Array(),{stream:!done});let at;while((at=pending.indexOf('\n'))>=0){let line=pending.slice(0,at).trim();pending=pending.slice(at+1);if(!line.startsWith('data:'))continue;let data=line.slice(5).trim();if(data==='[DONE]'){finished=true;continue}let event=JSON.parse(data);answer.content+=event.choices?.[0]?.delta?.content||'';render()}if(done)break}if(!finished)throw Error(t.interrupted);save();$('status').textContent=''}catch(e){if(!answer.content)c.messages.pop();save();$('status').textContent=e.message}finally{busy=false;render()}};
render();models();
</script></html>
