name: Windows Prism LAN isolated test
on:
  push:
    branches: [prism-lan-isolato]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: rustup update stable
      - name: Test Rust
        shell: pwsh
        run: |
          cargo fmt --check
          if ($LASTEXITCODE -ne 0) { throw 'Formatting failed' }
          cargo test --locked
          if ($LASTEXITCODE -ne 0) { throw 'Tests failed' }
      - name: Package Prism
        shell: pwsh
        run: |
          curl.exe -fL --retry 3 'https://github.com/oschwartz10612/poppler-windows/releases/download/v26.09.0-0/Release-26.09.0-0.zip' -o "$env:RUNNER_TEMP/poppler.zip"
          if ($LASTEXITCODE -ne 0) { throw 'Poppler download failed' }
          Expand-Archive "$env:RUNNER_TEMP/poppler.zip" "$env:RUNNER_TEMP/poppler"
          $pdf = Get-ChildItem "$env:RUNNER_TEMP/poppler" -Filter pdftotext.exe -Recurse -File | Select-Object -First 1
          & scripts/package-windows-prism.ps1 -PdfToText $pdf.FullName -Zip
      - name: Test two browser sessions via HTTP
        run: python scripts/test-browser-lan.py release/LlamaNest-Prism-Bonsai-Windows-x64
      - uses: actions/upload-artifact@v4
        with:
          name: LlamaNest-Prism-LAN-isolato-Windows-x64
          path: release/LlamaNest-Prism-Bonsai-Windows-x64.zip
          if-no-files-found: error
      - name: Publish separate experimental download
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $tag = 'prism-lan-dual-2026-11-02'
          $notes = 'Versione Windows LAN sperimentale con selezione automatica Prism per Bonsai 2 e llama.cpp per gli altri modelli: chat, documenti e memoria sono separati per browser, ma salvati in cartelle distinte sul PC server. Usa HTTP senza autenticazione: solo reti fidate. Il modello non e incluso.'
          gh release create $tag 'release/LlamaNest-Prism-Bonsai-Windows-x64.zip' --target $env:GITHUB_SHA --title 'LlamaNest Windows Prism LAN - prova isolamento' --notes $notes --prerelease
          if ($LASTEXITCODE -ne 0) { throw 'Could not publish the separate test release' }
