name: Experimental LAN prototype
on:
  push:
    branches: [main]
    paths: ['lan-experimental/**', '.github/workflows/lan-experimental.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test lan-experimental/server.test.mjs
